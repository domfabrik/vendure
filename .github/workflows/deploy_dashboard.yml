name: '🚀 Deploy Dashboard'

on:
    workflow_dispatch:
    push:
        branches: [main, test]
        paths:
            - 'packages/dashboard/**'
            - 'packages/core/**'
            - 'packages/common/**'
            - 'package.json'
            - 'package-lock.json'

env:
    NODE_OPTIONS: '--max_old_space_size=4096'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup environment
              uses: ./.github/actions/setup

            - name: Install Vercel CLI
              run: npm i --ignore-scripts -g vercel@latest

            - name: Link Vercel project
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: vercel link --yes --scope vendure --project=admin-dashboard --token="$VERCEL_TOKEN"

            - name: Pull Vercel environment variables
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_ENV: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'production' || 'preview' }}
              run: |
                  vercel env pull --environment="$VERCEL_ENV" --yes --scope vendure --token="$VERCEL_TOKEN"
                  cp .env.local packages/dashboard/.env.local

            - name: Build common and core packages
              run: npm run build:core-common

            - name: Build Dashboard
              run: npm run build:standalone --workspace=@vendure/dashboard

            - name: Deploy to Vercel
              id: deploy_vercel
              uses: ./.github/actions/deploy-vercel
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-project-name: admin-dashboard
                  environment: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'production' || 'preview' }}
                  production: ${{ github.ref_name == 'main' && github.event_name == 'push' && 'true' || 'false' }}
                  build-output-path: packages/dashboard/dist

            - name: Print Vercel URL
              run: echo "Dashboard URL ${{ steps.deploy_vercel.outputs.deployment-url }}"

